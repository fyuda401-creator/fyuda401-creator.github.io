<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio NOC - Network Operations Center</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-header h2 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .line {
            height: 2px;
            background-color: var(--border-color);
            margin-bottom: 20px;
        }

        /* Form Styling */
        .feedback-form {
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-primary);
            box-sizing: border-box;
        }

        .form-input:focus, .form-textarea:focus {
            outline: 1px solid var(--accent-color);
        }

        .btn-submit {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        /* Feedback Card Output */
        .feedback-list {
            margin-top: 25px;
        }

        .feedback-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .feedback-header {
            display: flex;
            justify-content: space-between;
            color: var(--accent-color);
            font-size: 0.85rem;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        /* Terminal Styling */
        .terminal-box {
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 30px;
        }

        .prompt {
            color: #10b981;
        }

        .highlight {
            color: var(--accent-color);
        }

        .cli-input-container {
            display: flex;
            margin-top: 10px;
        }

        .cli-input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            width: 100%;
            outline: none;
            margin-left: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NOC Interactive Terminal -->
        <section id="terminal-section">
            <div class="section-header">
                <h2>NOC Interactive CLI</h2>
                <div class="line"></div>
            </div>
            <div class="terminal-box" id="term-body">
                <div id="term-history">
                    <div>Ketik <span class="highlight">'help'</span> untuk melihat daftar perintah troubleshooting yang tersedia.</div>
                </div>
                <div class="cli-input-container">
                    <span class="prompt">noc@lambda:~#</span>
                    <input type="text" id="cli-input" class="cli-input" autofocus autocomplete="off">
                </div>
            </div>
        </section>

        <!-- Form Saran & Masukan via Formspree -->
        <section id="saran">
            <div class="section-header">
                <h2>Kirim Saran & Masukan</h2>
                <div class="line"></div>
            </div>

            <div class="feedback-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap *</label>
                        <input type="text" id="nama" name="nama" class="form-input" placeholder="Masukkan nama Anda..." required>
                    </div>
                    <div class="form-group">
                        <label for="gmail">Alamat Email (Gmail) *</label>
                        <input type="email" id="gmail" name="email" class="form-input" placeholder="contoh: nama@gmail.com" pattern="[a-zA-Z0-9._%+-]+@gmail\.com$" title="Harus menggunakan alamat @gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="pesan">Pesan / Saran *</label>
                        <textarea id="pesan" name="pesan" class="form-textarea" rows="4" placeholder="Tuliskan saran atau pesan untuk operasional NOC..." required></textarea>
                    </div>
                    <button type="submit" id="btnSubmit" class="btn-submit">Kirim Masukan</button>
                </form>

                <div class="feedback-list" id="feedback-list"></div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Network Operations Center @ FAJAR YUDA PRATAMA</p>
    </footer>

    <!-- JavaScript Logika Terminal & Formspree Integration -->
    <script>
        // --- 1. Logika Terminal CLI ---
        const cliInput = document.getElementById('cli-input');
        const termHistory = document.getElementById('term-history');
        const termBody = document.getElementById('term-body');

        const commands = {
            'help': `Daftar Syntax Tersedia:<br>
  - <span class="highlight">biodata</span> <br>
  - <span class="highlight">ftth-troubleshoot</span>  <br>
  - <span class="highlight">switch-troubleshoot</span> <br>
  - <span class="highlight">nms-status</span>  <br>
  - <span class="highlight">check-device</span>  <br>
  - <span class="highlight">status</span>  <br>
  - <span class="highlight">clear</span>`,
            
            'biodata': `==============================================<br>
<span class="highlight">DATA DIRI & SKILLS ENGINEER</span><br>
==============================================<br>
Nama        : Fajar Yuda Pratama<br>
Peran       : Network Operations Center (NOC)<br>
Perusahaan  : PT. Lambda Sinergi Telekomunikasi<br>
Spesialisasi: Monitoring Tools (Cacti, SmokePing), FTTH (ZTE OLT), Switch (Huawei VRP)<br>
==============================================`,

            'ftth-troubleshoot': `==============================================<br>
<span class="highlight">[SYNTAX TROUBLESHOOTING FTTH / OLT ZTE]</span><br>
==============================================<br>
1. Cek Redaman ONU             : <span style="color:#10b981;">show pon power attenuation gpon-onu_1/1/1:1</span><br>
2. Cek ONU Belum Terkonfigurasi: <span style="color:#10b981;">show gpon onu uncfg</span><br>
3. Cek ONU Terdaftar di OLT   : <span style="color:#10b981;">show gpon onu state gpon-olt_1/1/1</span><br>
4. Reboot ONU dari OLT         : <span style="color:#10b981;">pon-onu-mng gpon-onu_1/1/1:1 reboot</span><br>
==============================================`,

            'switch-troubleshoot': `==============================================<br>
<span class="highlight">[SYNTAX DIAGNOSIS SWITCH - HUAWEI VRP]</span><br>
==============================================<br>
1. Melihat Seluruh Konfigurasi : <span style="color:#10b981;">display current-configuration</span><br>
2. Ringkasan Status Semua Port  : <span style="color:#10b981;">display interface brief</span><br>
3. Tabel MAC Address            : <span style="color:#10b981;">display mac-address</span><br>
==============================================`,

            'nms-status': `[STATUS NMS]<br>
- Cacti NMS Server    : [<span style="color:#10b981;">RUNNING</span>]<br>
- SmokePing Server    : [<span style="color:#10b981;">RUNNING</span>]<br>
- MikroTik The Dude   : [<span style="color:#10b981;">ONLINE</span>]`,

            'check-device': `[PENGECEKAN PERANGKAT JARINGAN]<br>
- Core Router MikroTik  : [<span style="color:#10b981;">ONLINE</span>]<br>
- Switch Distribution    : [<span style="color:#10b981;">ONLINE</span>]<br>
- OLT Fiber Backbone     : [<span style="color:#10b981;">ONLINE</span>]`,

            'status': '[OK] Status Jaringan: NORMAL (Latency 2ms, Packet Loss 0%).',
            'clear': 'CLEAR'
        };

        cliInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const inputVal = this.value.trim().toLowerCase();
                
                if (inputVal !== '') {
                    const userLine = document.createElement('div');
                    userLine.innerHTML = `<span class="prompt">noc@lambda:~#</span> ${this.value}`;
                    termHistory.appendChild(userLine);

                    const responseLine = document.createElement('div');
                    responseLine.style.marginBottom = "10px";

                    if (inputVal === 'clear') {
                        termHistory.innerHTML = '';
                    } else if (commands[inputVal]) {
                        responseLine.innerHTML = commands[inputVal];
                        termHistory.appendChild(responseLine);
                    } else {
                        responseLine.innerHTML = `<span style="color:#ef4444;">Syntax '${inputVal}' tidak dikenali. Ketik 'help' untuk petunjuk.</span>`;
                        termHistory.appendChild(responseLine);
                    }

                    termBody.scrollTop = termBody.scrollHeight;
                }
                this.value = '';
            }
        });

        // --- 2. Logika Form Masukan Menggunakan Formspree ---
        const FORMSPREE_URL = 'https://formspree.io/f/mbgjqape';
        const contactForm = document.getElementById('contactForm');
        const feedbackList = document.getElementById('feedback-list');
        const btnSubmit = document.getElementById('btnSubmit');

        contactForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const gmail = document.getElementById('gmail').value;
            const pesan = document.getElementById('pesan').value;

            btnSubmit.innerText = 'Mengirim Pesan...';
            btnSubmit.disabled = true;

            const formData = new FormData();
            formData.append('nama', nama);
            formData.append('email', gmail);
            formData.append('pesan', pesan);

            try {
                const response = await fetch(FORMSPREE_URL, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Tampilkan kartu pesan langsung ke tampilan web
                    const card = document.createElement('div');
                    card.className = 'feedback-card';
                    card.innerHTML = `
                        <div class="feedback-header">
                            <span><strong>${nama}</strong> (${gmail})</span>
                            <span>Baru saja</span>
                        </div>
                        <div style="color: var(--text-primary); font-size: 0.9rem;">${pesan}</div>
                    `;

                    feedbackList.prepend(card);
                    contactForm.reset();
                    alert('Terima kasih! Pesan/Saran Anda berhasil terkirim ke Formspree.');
                } else {
                    alert('Gagal mengirim pesan. Silakan periksa kembali data Anda.');
                }

            } catch (error) {
                alert('Terjadi kesalahan koneksi saat mengirim pesan ke Formspree.');
            } finally {
                btnSubmit.innerText = 'Kirim Masukan';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
